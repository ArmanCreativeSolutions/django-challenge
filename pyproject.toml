[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "volleyball_ticketing.settings"
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"
markers = ["redis: integration tests requiring a real Redis server"]

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.coverage.run]
source = ["accounts", "booking", "shared", "volleyball_ticketing.dependency_container"]
omit = ["*/migrations/*", "*/tests/*"]

